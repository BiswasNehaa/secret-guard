name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          echo "API_KEY = 'AKIAIOSFODNN7EXAMPLE'" > smoke.py
          secret-guard scan --no-entropy .; test $? -eq 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ruff
      - name: Ruff check
        run: ruff check secretguard tests